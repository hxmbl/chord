[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chord"
version = "0.1.0"
description = "Connect Linear together with tools you already use."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "authlib>=1.8.0",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "python-dotenv>=1.2.3",
    "desktop-notifier>=6.1.0",
]

[project.optional-dependencies]
# Legacy WebSocket wake-ups are optional. Webhooks are the primary live path;
# polling remains the backup either way.
live = [
    "gql[websockets]>=4.4.0",
]
dev = [
    "build>=1.2",
    "pyright>=1.1.380",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.16",
]

[project.scripts]
chord = "chord.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/chord"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = [
    "B008",  # typer.Option(...) default arguments are the CLI idiom
    "BLE001",  # deliberate network/disk-tolerant exception handling
    "S110",  # intentional except-pass while probing connectivity/disk edge cases
    "S112",  # intentional ignore + manual returncode handling
    "PLW1510",  # subprocess without check=True; returncode checked explicitly
]

[tool.pyright]
include = ["src"]
typeCheckingMode = "basic"
pythonVersion = "3.11"

[tool.pytest.ini_options]
testpaths = ["test"]
addopts = "--cov=src --cov-report=term-missing:skip-covered --cov-report=xml --cov-fail-under=70"
# `slow` is for tests that spawn real processes and wait on them. They are not
# skipped by default -- the ones using it are the ones that catch the failures
# worth catching -- but they can be deselected with `-m "not slow"` when a fast
# inner loop matters more than the process-tree checks.
markers = ["slow: spawns real processes and waits on them"]
